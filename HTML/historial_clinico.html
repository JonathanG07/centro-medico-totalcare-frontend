<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historial Clínico</title>
  <link rel="stylesheet" href="../CSS/style.css" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">
  <!-- Barra superior -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="navbar-brand" href="paciente.html">Centro Médico</a>
      <span class="navbar-text">Historial Clínico</span>
    </div>
  </nav>

  <!-- Contenedor principal -->
  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h3 class="text-center text-primary mb-4">
        Consulta tu Historial Médico
      </h3>

      <div class="mb-3">
        <label for="pacienteId" class="form-label">ID de Paciente</label>
        <input
          type="text"
          id="pacienteId"
          class="form-control"
          readonly
        />
      </div>

      <div class="text-center">
        <button id="btnConsultar" class="btn btn-primary px-4">
          Consultar Historial
        </button>
      </div>

      <hr />

      <!-- Resultados -->
      <div id="resultados" class="mt-4">
        <h5 class="text-secondary">Resultados:</h5>
        <ul id="listaHistorial" class="list-group mt-2"></ul>
      </div>
    </div>
  </div>

  <script>
    // 1️⃣ Cargar el ID del paciente desde localStorage (guardado al iniciar sesión o entrar desde paciente.html)
    const pacienteId = localStorage.getItem('pacienteId');

    document.addEventListener('DOMContentLoaded', () => {
      const input = document.getElementById('pacienteId');
      if (pacienteId) {
        input.value = pacienteId;
      } else {
        input.value = 'No definido (inicia sesión)';
        document.getElementById('btnConsultar').disabled = true;
      }
    });

    // 2️⃣ Consultar historial médico
    document.getElementById('btnConsultar').addEventListener('click', consultarHistorial);

    async function consultarHistorial() {
      const lista = document.getElementById('listaHistorial');
      lista.innerHTML = '';

      if (!pacienteId) {
        alert('No hay un paciente activo. Por favor inicia sesión.');
        return;
      }

      try {
        const response = await fetch(`http://localhost:3000/api/historial/${pacienteId}`);

        if (!response.ok) throw new Error('No se pudo obtener el historial clínico');

        const data = await response.json();

        if (data.length === 0) {
          lista.innerHTML = '<li class="list-group-item text-center text-muted">No hay registros disponibles</li>';
          return;
        }

        data.forEach(cita => {
          const fecha = new Date(cita.fecha).toLocaleDateString('es-CO');
          const li = document.createElement('li');
          li.classList.add('list-group-item');
          li.innerHTML = `
            <strong>Fecha:</strong> ${fecha}<br>
            <strong>Motivo:</strong> ${cita.motivo}<br>
            <strong>Doctor:</strong> ${cita.doctorId?.nombre || 'No registrado'}
          `;
          lista.appendChild(li);
        });
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }
  </script>
</body>
</html>
