  <div class="container mt-5">
    <div class="card shadow-lg p-4">
      <h3 class="text-center text-danger mb-4">
        Cancelar Citas Agendadas
      </h3>

      <div class="mb-3">
        <label for="pacienteId" class="form-label">ID de Paciente</label>
        <input
          type="text"
          id="pacienteId"
          class="form-control"
          readonly
        />
      </div>

      <div class="text-center mb-4">
        <button id="btnConsultar" class="btn btn-primary px-4">
          Ver Mis Citas
        </button>
      </div>

      <div id="resultados" class="mt-4">
        <h5 class="text-secondary">Citas Agendadas:</h5>
        <ul id="listaCitas" class="list-group mt-2"></ul>
      </div>
    </div>
  </div>

  <script>
  const usuario = JSON.parse(localStorage.getItem('usuario'));
  const pacienteId = usuario?.id || usuario?._id;

  document.addEventListener('DOMContentLoaded', () => {
    const input = document.getElementById('pacienteId');
    if (pacienteId) {
      input.value = pacienteId;
    } else {
      input.value = 'No definido (inicia sesión)';
      document.getElementById('btnConsultar').disabled = true;
    }
  });

  document.getElementById('btnConsultar').addEventListener('click', cargarCitas);

  async function cargarCitas() {
    const lista = document.getElementById('listaCitas');
    lista.innerHTML = '';

    if (!pacienteId) {
      alert('Por favor inicia sesión');
      return;
    }

    try {
    //   const response = await fetch(`http://localhost:3000/api/citas/paciente/${pacienteId}`);
      const response = await fetch(`https://centro-medico-totalcare-backend.onrender.com/api/citas/paciente/${pacienteId}`);

      if (!response.ok) throw new Error('No se pudieron cargar las citas');

      const citas = await response.json();

      if (citas.length === 0) {
        lista.innerHTML = '<li class="list-group-item text-center text-muted">No tienes citas registradas</li>';
        return;
      }

      citas.forEach(cita => {
        const fecha = new Date(cita.fecha).toLocaleString('es-CO');
        const li = document.createElement('li');
        li.classList.add('list-group-item', 'd-flex', 'justify-content-between', 'align-items-center');

        li.innerHTML = `
          <div>
            <strong>Fecha:</strong> ${fecha}<br>
            <strong>Motivo:</strong> ${cita.motivo}<br>
            <strong>Doctor:</strong> ${cita.doctorId?.nombre || 'No registrado'}
          </div>
          <button class="btn btn-danger btn-sm" onclick="cancelarCita('${cita._id}')">Cancelar</button>
        `;
        lista.appendChild(li);
      });
    } catch (error) {
      alert('Error: ' + error.message);
    }
  }

  async function cancelarCita(idCita) {
    if (!confirm('¿Seguro que deseas cancelar esta cita?')) return;

    try {
    //   const response = await fetch(`http://localhost:3000/api/citas/${idCita}`, {
    const response = await fetch(`https://centro-medico-totalcare-backend.onrender.com/api/citas/${idCita}`, {
        method: 'DELETE'
      });

      if (!response.ok) throw new Error('No se pudo cancelar la cita');

      alert('✅ Cita cancelada exitosamente');
      cargarCitas(); // Actualizar la lista
    } catch (error) {
      alert('❌ Error al cancelar la cita: ' + error.message);
    }
  }
</script>
